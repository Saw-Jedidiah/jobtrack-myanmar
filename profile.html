<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Profile — JobTrack Myanmar</title>

    <!-- Google Fonts -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!-- ==================== SIDEBAR ==================== -->
        <aside
            class="sidebar"
            id="sidebar"
        >

            <!-- Brand -->
            <div class="brand">

                <span class="brand-logo">
                    JT
                </span>

                <span>
                    JobTrack Myanmar
                </span>

            </div>


            <!-- Navigation -->
            <nav class="nav">

                <a
                    class="nav-item"
                    href="index.html"
                >
                    <span class="nav-icon">
                        ⌂
                    </span>

                    Dashboard
                </a>


                <a
                    class="nav-item"
                    href="applications.html"
                >
                    <span class="nav-icon">
                        ▤
                    </span>

                    Applications
                </a>


                <a
                    class="nav-item"
                    href="kanban.html"
                >
                    <span class="nav-icon">
                        ▥
                    </span>

                    Kanban Board
                </a>


                <a
                    class="nav-item"
                    href="add-job.html"
                >
                    <span class="nav-icon">
                        ＋
                    </span>

                    Add Job
                </a>


                <!-- Account -->
                <div class="nav-label">
                    ACCOUNT
                </div>


                <a
                    class="nav-item"
                    href="profile.html"
                >
                    <span class="nav-icon">
                        ◯
                    </span>

                    Profile
                </a>


                <a
                    class="nav-item"
                    href="settings.html"
                >
                    <span class="nav-icon">
                        ⚙
                    </span>

                    Settings
                </a>

            </nav>

        </aside>


        <!-- Mobile Overlay -->
        <div
            class="mobile-overlay"
            id="mobileOverlay"
        ></div>


        <!-- ==================== MAIN ==================== -->
        <main class="main">

            <!-- ==================== TOPBAR ==================== -->
            <header class="topbar">

                <div class="topbar-left">

                    <!-- Mobile Menu -->
                    <button
                        class="mobile-menu"
                        id="mobileMenu"
                        type="button"
                        aria-label="Open menu"
                    >
                        ☰
                    </button>


                    <div>

                        <h1>
                            Profile
                        </h1>

                        <p>
                            Your personal information
                        </p>

                    </div>

                </div>


                <!-- Topbar Actions -->
                <div class="topbar-actions">

                    <!-- Theme Toggle -->
                    <button
                        class="theme-toggle"
                        id="themeToggle"
                        type="button"
                        aria-label="Toggle theme"
                    >
                        ☾
                    </button>


                    <!-- User Avatar -->
                    <div
                        class="avatar avatar-sm"
                        id="headerAvatar"
                    ></div>

                </div>

            </header>


            <!-- ==================== PAGE ==================== -->
            <section class="page narrow-page">

                <!-- Page Header -->
                <div class="page-header">

                    <div>

                        <p class="eyebrow">
                            ACCOUNT
                        </p>

                        <h2>
                            Profile
                        </h2>

                    </div>

                </div>


                <!-- ==================== PROFILE LAYOUT ==================== -->
                <div class="profile-layout">

                    <!-- ==================== PROFILE CARD ==================== -->
                    <div class="card profile-card">

                        <!-- Cover -->
                        <div class="profile-cover"></div>


                        <!-- Profile Main -->
                        <div class="profile-main">

                            <!-- Profile Photo -->
                            <div class="profile-photo-wrapper">

                                <img
                                    id="profilePreview"
                                    class="profile-photo"
                                    alt="Profile photo"
                                >

                            </div>


                            <!-- Upload Photo -->
                            <label
                                class="photo-upload-btn"
                                for="profilePhoto"
                            >
                                Change profile photo
                            </label>

                            <input
                                id="profilePhoto"
                                type="file"
                                accept="image/*"
                                hidden
                            >


                            <!-- Display Name -->
                            <h2 id="profileDisplayName">
                                Job Seeker
                            </h2>


                            <!-- Display Role -->
                            <p id="profileDisplayRole">
                                Job Seeker
                            </p>

                        </div>

                    </div>


                    <!-- ==================== PROFILE FORM ==================== -->
                    <form
                        id="profileForm"
                        class="card form-card"
                    >

                        <div class="form-grid">

                            <!-- Name -->
                            <div class="form-group">

                                <label for="profileName">
                                    Name
                                </label>

                                <input
                                    id="profileName"
                                    name="name"
                                    type="text"
                                    required
                                >

                            </div>


                            <!-- Role -->
                            <div class="form-group">

                                <label for="profileRole">
                                    Role
                                </label>

                                <input
                                    id="profileRole"
                                    name="role"
                                    type="text"
                                >

                            </div>


                            <!-- Email -->
                            <div class="form-group">

                                <label for="profileEmail">
                                    Email
                                </label>

                                <input
                                    id="profileEmail"
                                    name="email"
                                    type="email"
                                >

                            </div>


                            <!-- Phone -->
                            <div class="form-group">

                                <label for="profilePhone">
                                    Phone
                                </label>

                                <input
                                    id="profilePhone"
                                    name="phone"
                                    type="tel"
                                >

                            </div>


                            <!-- Location -->
                            <div class="form-group full-width">

                                <label for="profileLocation">
                                    Location
                                </label>

                                <input
                                    id="profileLocation"
                                    name="location"
                                    type="text"
                                >

                            </div>


                            <!-- Bio -->
                            <div class="form-group full-width">

                                <label for="profileBio">
                                    Bio
                                </label>

                                <textarea
                                    id="profileBio"
                                    name="bio"
                                    placeholder="Tell us a little about yourself..."
                                ></textarea>

                            </div>

                        </div>


                        <!-- Form Actions -->
                        <div class="form-actions">

                            <button
                                class="btn btn-primary"
                                type="submit"
                            >
                                Save Profile
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>


    <!-- ==================== TOAST ==================== -->
    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- Main JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
