<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="JobTrack Myanmar - User Profile"
    >

    <title>Profile — JobTrack Myanmar</title>

    <!-- Google Fonts -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="app">

        <!-- ==================== SIDEBAR ==================== -->
        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="brand">

                <span class="brand-logo">
                    JT
                </span>

                <span>
                    JobTrack Myanmar
                </span>

            </div>


            <nav class="nav">

                <a
                    class="nav-item"
                    href="index.html"
                >
                    <span class="nav-icon">⌂</span>
                    Dashboard
                </a>


                <a
                    class="nav-item"
                    href="applications.html"
                >
                    <span class="nav-icon">▤</span>
                    Applications
                </a>


                <a
                    class="nav-item"
                    href="kanban.html"
                >
                    <span class="nav-icon">▥</span>
                    Kanban Board
                </a>


                <a
                    class="nav-item"
                    href="add-job.html"
                >
                    <span class="nav-icon">＋</span>
                    Add Job
                </a>


                <div class="nav-label">
                    ACCOUNT
                </div>


                <a
                    class="nav-item"
                    href="profile.html"
                >
                    <span class="nav-icon">◯</span>
                    Profile
                </a>


                <a
                    class="nav-item"
                    href="settings.html"
                >
                    <span class="nav-icon">⚙</span>
                    Settings
                </a>

            </nav>

        </aside>


        <!-- ==================== MOBILE OVERLAY ==================== -->
        <div
            class="mobile-overlay"
            id="mobileOverlay"
        ></div>


        <!-- ==================== MAIN ==================== -->
        <main class="main">

            <!-- ==================== TOPBAR ==================== -->
            <header class="topbar">

                <div class="topbar-left">

                    <button
                        class="mobile-menu"
                        id="mobileMenu"
                        type="button"
                        aria-label="Open menu"
                    >
                        ☰
                    </button>


                    <div>

                        <h1>
                            Profile
                        </h1>

                        <p>
                            Your personal information
                        </p>

                    </div>

                </div>


                <div class="topbar-actions">

                    <button
                        class="theme-toggle"
                        id="themeToggle"
                        type="button"
                        aria-label="Toggle theme"
                    >
                        ☾
                    </button>


                    <div
                        class="avatar avatar-sm"
                        id="headerAvatar"
                    ></div>

                </div>

            </header>


            <!-- ==================== PAGE ==================== -->
            <section class="page narrow-page">

                <div class="page-header">

                    <div>

                        <p class="eyebrow">
                            ACCOUNT
                        </p>

                        <h2>
                            Profile
                        </h2>

                    </div>

                </div>


                <!-- ==================== PROFILE LAYOUT ==================== -->
                <div class="profile-layout">


                    <!-- ==================== PROFILE CARD ==================== -->
                    <div class="card profile-card">

                        <div class="profile-cover"></div>


                        <div class="profile-main">

                            <!-- PROFILE PHOTO -->
                            <div class="profile-photo-wrapper">

                                <!-- Initials fallback -->
                                <div
                                    id="profileFallback"
                                    class="profile-photo-fallback"
                                    aria-hidden="true"
                                >
                                    JS
                                </div>


                                <!-- Actual profile image -->
                                <img
                                    id="profilePreview"
                                    class="profile-photo"
                                    src=""
                                    alt="Profile photo"
                                    style="display: none;"
                                >

                            </div>


                            <!-- CHANGE PHOTO -->
                            <label
                                class="photo-upload-btn"
                                for="profilePhoto"
                            >
                                Change profile photo
                            </label>


                            <input
                                id="profilePhoto"
                                name="profilePhoto"
                                type="file"
                                accept="image/jpeg,image/png,image/webp,image/gif"
                                hidden
                            >


                            <!-- NAME -->
                            <h2 id="profileDisplayName">
                                Job Seeker
                            </h2>


                            <!-- ROLE -->
                            <p id="profileDisplayRole">
                                Job Seeker
                            </p>

                        </div>

                    </div>


                    <!-- ==================== PROFILE FORM ==================== -->
                    <form
                        id="profileForm"
                        class="card form-card"
                    >

                        <div class="form-grid">


                            <!-- NAME -->
                            <div class="form-group">

                                <label for="profileName">
                                    Name
                                </label>

                                <input
                                    id="profileName"
                                    name="name"
                                    type="text"
                                    autocomplete="name"
                                    required
                                >

                            </div>


                            <!-- ROLE -->
                            <div class="form-group">

                                <label for="profileRole">
                                    Role
                                </label>

                                <input
                                    id="profileRole"
                                    name="role"
                                    type="text"
                                    autocomplete="organization-title"
                                >

                            </div>


                            <!-- EMAIL -->
                            <div class="form-group">

                                <label for="profileEmail">
                                    Email
                                </label>

                                <input
                                    id="profileEmail"
                                    name="email"
                                    type="email"
                                    autocomplete="email"
                                >

                            </div>


                            <!-- PHONE -->
                            <div class="form-group">

                                <label for="profilePhone">
                                    Phone
                                </label>

                                <input
                                    id="profilePhone"
                                    name="phone"
                                    type="tel"
                                    autocomplete="tel"
                                >

                            </div>


                            <!-- LOCATION -->
                            <div class="form-group full-width">

                                <label for="profileLocation">
                                    Location
                                </label>

                                <input
                                    id="profileLocation"
                                    name="location"
                                    type="text"
                                    autocomplete="address-level2"
                                >

                            </div>


                            <!-- BIO -->
                            <div class="form-group full-width">

                                <label for="profileBio">
                                    Bio
                                </label>

                                <textarea
                                    id="profileBio"
                                    name="bio"
                                    rows="5"
                                    placeholder="Tell us a little about yourself..."
                                ></textarea>

                            </div>

                        </div>


                        <!-- FORM ACTION -->
                        <div class="form-actions">

                            <button
                                class="btn btn-primary"
                                type="submit"
                            >
                                Save Profile
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>


    <!-- ==================== TOAST ==================== -->
    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- ==================== JAVASCRIPT ==================== -->
    <script src="js/app.js"></script>

</body>

</html>
